[workspace]
resolver = "2"
members = [
    "crates/openspace-core",
    "crates/openspace-vision",
    "crates/openspace-mesh",
    "crates/openspace-texture",
    "crates/openspace-plugin",
    "crates/openspace-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OpenSpace"]

[workspace.dependencies]
openspace-core = { path = "crates/openspace-core" }
openspace-vision = { path = "crates/openspace-vision" }
openspace-mesh = { path = "crates/openspace-mesh" }
openspace-texture = { path = "crates/openspace-texture" }
openspace-plugin = { path = "crates/openspace-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
